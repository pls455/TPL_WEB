name: Static checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          for file in app.js academics-admin.js admin-operations.js; do
            node --input-type=module --check < "$file"
          done
      - name: Verify required files
        run: test -s index.html && test -s styles.css && test -s firestore.rules && test -s storage.rules
